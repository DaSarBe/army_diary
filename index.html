<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#151a13">
<meta name="description" content="阿兵哥日記：第三人稱 3D 角色扮演遊戲，體驗中華民國國軍義務役的一年。">
<meta property="og:title" content="阿兵哥日記">
<meta property="og:description" content="接任務、練體能、升等級，走完三百六十五天的義務役。">
<title>阿兵哥日記</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='6' width='36' height='52' rx='16' fill='%23cdd1be'/%3E%3Ccircle cx='32' cy='16' r='4' fill='%23151a13'/%3E%3Crect x='22' y='28' width='20' height='4' fill='%23232a1d'/%3E%3Crect x='22' y='38' width='20' height='4' fill='%23232a1d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="gl" aria-label="3D 遊戲畫面"></canvas>

<header id="hud" hidden>
  <div class="h1"><span id="hWho"></span><span id="hDay"></span><span id="hRes"></span></div>
  <div class="h2">
    <div class="bar hp" title="體力"><u id="bHp"></u><em id="tHp"></em></div>
    <div class="bar fa" title="疲勞"><u id="bFa"></u><em id="tFa"></em></div>
    <div class="bar xp" title="經驗"><u id="bXp"></u><em id="tXp"></em></div>
  </div>
  <div class="h3" id="hAttr"></div>
  <div class="h4" id="hStat"></div>
</header>

<button id="track" class="track" hidden type="button">
  <svg id="trArr" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 20 L12 15.5 L4 20 Z" fill="currentColor"/></svg>
  <span id="trTxt"></span>
</button>
<div id="timer" class="timer-chip" hidden></div>

<nav id="side" hidden>
  <button type="button" data-p="journal">任務</button>
  <button type="button" data-p="bag">背包</button>
  <button type="button" data-p="skills">技能</button>
  <button type="button" data-p="char">角色</button>
  <button type="button" data-p="menu">選單</button>
  <button type="button" id="mute">音效開</button>
</nav>

<div id="joy" hidden aria-label="移動搖桿"><i id="knob"></i></div>
<button id="act" hidden type="button"></button>
<div id="hold" hidden><span id="holdTx"></span><div class="mg-timer"><u id="holdBar"></u></div></div>

<section id="dlg" class="sheet" hidden role="dialog" aria-live="polite">
  <div class="in">
    <div id="dName" class="dname"></div>
    <div id="dText" class="dtext"></div>
    <div id="dBtns" class="dbtns"></div>
  </div>
</section>

<section id="panel" hidden role="dialog" aria-modal="true">
  <div class="phead"><h2 id="pTitle"></h2><button id="pClose" type="button" aria-label="關閉">關閉</button></div>
  <div id="pTabs" class="ptabs"></div>
  <div id="pBody" class="pbody"></div>
</section>

<section id="card" hidden role="dialog" aria-modal="true">
  <div class="cin" id="cIn"></div>
</section>

<section id="mg" hidden role="dialog" aria-modal="true">
  <div class="mg-card">
    <h2 id="mgT"></h2>
    <p id="mgD" class="mg-desc"></p>
    <div id="mgA" class="mg-area"></div>
    <div id="mgS" class="mg-stat"></div>
  </div>
</section>

<section id="fps" hidden>
  <div id="dmgfx"></div>
  <div id="xhair" hidden><i></i></div>
  <div id="hitmk"><b></b></div>
  <div id="waveBanner"></div>
  <div id="waveTop"><b id="waveName"></b><span id="waveLeft"></span><div class="mg-timer"><u id="waveHold"></u></div></div>
  <div id="ammoHud"><span id="magHint"></span><span id="magRes"></span><span id="fireMode"></span><span id="coverState"></span></div>
  <div id="fpsMsg"></div>
  <p id="fpsHint">F 舉槍／放下　C 掩體／探頭　R 換彈　V 單發／連發　T 輔助瞄準　滑鼠左鍵或空白鍵射擊　右鍵瞄準</p>
  <div id="fpsBtns">
    <button type="button" id="bFire" hidden>射擊</button>
    <button type="button" id="bReload" hidden>換彈</button>
    <button type="button" id="bCover" hidden>掩體</button>
    <button type="button" id="bRaise" hidden>舉槍</button>
    <button type="button" id="bMode" hidden>單發</button>
    <button type="button" id="bAssist" hidden>輔助瞄準：關</button>
  </div>
</section>

<div id="gfxHud" hidden aria-live="polite"></div>
<div id="toasts" aria-live="polite"></div>
<div id="fade"></div>
<div id="fadeTxt"></div>

<section id="glerr" hidden role="alert">
  <div class="cin">
    <h2>無法顯示 3D 畫面</h2>
    <p>這個瀏覽器或裝置沒辦法啟用 WebGL，所以遊戲畫面出不來。可以試試下面的方法：</p>
    <ul>
      <li>確認瀏覽器已開啟「硬體加速」（Chrome：設定 → 系統 → 使用圖形加速）。</li>
      <li>更新瀏覽器與顯示卡驅動程式，或改用最新版的 Chrome、Edge、Safari、Firefox。</li>
      <li>手機請關閉省電模式後重新開啟頁面。</li>
    </ul>
    <button type="button" class="primary" id="glRetry">重新載入</button>
  </div>
</section>
<section id="lost" hidden role="alert">
  <div class="cin"><h2>畫面中斷了</h2><p>顯示裝置暫時失去連線（例如切換了 App）。正在嘗試恢復，請稍候…</p></div>
</section>
<noscript><p style="padding:24px;color:#fff;background:#151a13">這個遊戲需要開啟 JavaScript 才能執行。</p></noscript>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<script src="vendor/CopyShader.js"></script>
<script src="vendor/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/MaskPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="js/gfx.js"></script>
<script src="js/engine.js"></script>
<script src="js/places.js"></script>
<script src="js/audio.js"></script>
<script src="js/characters.js"></script>
<script src="js/world.js"></script>
<script src="js/minigames.js"></script>
<script src="js/fps.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
