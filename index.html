<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>阿兵哥日記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: full-screen 3D third-person world. HUD floats on top, story text slides up as a bottom sheet, joystick bottom-left. */
:root{
  --bg:#151a13;
  --panel:#1f271c;
  --panel-2:#2b3626;
  --line:#3b4834;
  --fg:#ecedde;
  --mute:#a3ae91;
  --brass:#e2bb4f;
  --brass-ink:#1c1a0b;
  --good:#92c47a;
  --bad:#e5826a;
  --m-b:#e2a94f;
  --m-m:#92c47a;
  --m-d:#7fb4cf;
  --m-o:#d49bb8;
  --tag-a:#cdd1be;
  --tag-b:#959c87;
  --tag-ink:#232a1d;
  --hud:rgba(21,26,19,.84);
  --sheet:rgba(21,26,19,.95);
  --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  overflow:hidden;
  height:100%;
  overscroll-behavior:none;
}
html{height:100%;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
.mono{font-family:var(--f-mono)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* HUD */
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;pointer-events:none;background:var(--hud);padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
#hud .in{max-width:560px;margin:0 auto}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--mute)}
.hud-top b{color:var(--brass);font-size:15px;font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px;margin:8px 0 12px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--panel-2)}
.segs i.done{background:var(--mute)}
.segs i.cur{background:var(--brass)}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.meter{min-width:0}
.meter .row{display:flex;justify-content:space-between;font-size:12px;line-height:1.2;margin-bottom:5px;color:var(--mute)}
.meter .row em{font-style:normal;font-family:var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.meter .bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.meter .bar u{display:block;height:100%;width:50%;background:var(--c);transition:width .5s ease}

/* Stage */
.scene{padding-top:14px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--mute)}
.title{margin:6px 0 16px;font-family:var(--f-display);font-weight:900;font-size:clamp(28px,8vw,38px);line-height:1.25;text-wrap:balance}
.prose p{margin:0 0 .95em}
.chose{margin:0 0 14px;font-size:14px;color:var(--mute)}
.choices{display:grid;gap:10px;margin-top:24px}
.choice{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;min-height:54px;padding:14px 16px;font-size:16px;line-height:1.6;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--brass);background:var(--panel-2)}
.choice:active{transform:scale(.99)}
.choice .lab{flex:none;font-family:var(--f-display);font-weight:900;color:var(--brass);width:1.2em}
.next,.primary{display:block;width:100%;min-height:54px;margin-top:22px;padding:14px 18px;font-size:17px;font-weight:700;letter-spacing:.08em;background:var(--brass);color:var(--brass-ink);border:0;border-radius:10px;cursor:pointer}
.next:active,.primary:active{transform:scale(.99)}
.ghost{display:block;width:100%;min-height:50px;margin-top:10px;padding:12px 18px;font-size:16px;background:transparent;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.ghost:hover{border-color:var(--brass)}
.deltas{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0;list-style:none}
.deltas li{font-family:var(--f-mono);font-size:14px;padding:3px 11px;border:1px solid currentColor;border-radius:999px}
.deltas .up{color:var(--good)}
.deltas .dn{color:var(--bad)}
.hint{margin:12px 0 0;font-size:14px;color:var(--mute);text-align:center}

/* Title: dog tag */
.tag{position:relative;max-width:340px;margin:30px auto 26px;padding:46px 22px 28px;text-align:center;color:var(--tag-ink);border-radius:34px;background:linear-gradient(155deg,var(--tag-a),var(--tag-b));box-shadow:0 10px 0 rgba(0,0,0,.28)}
.tag::before{content:"";position:absolute;top:15px;left:50%;width:46px;height:12px;margin-left:-23px;border-radius:8px;background:var(--bg);box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.tag .no{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em}
.tag h1{margin:8px 0 10px;font-family:var(--f-display);font-weight:900;font-size:42px;letter-spacing:.08em;line-height:1.2}
.tag p{margin:0;font-size:14px;line-height:1.7}
.field{display:block;margin:0 0 6px;font-size:14px;color:var(--mute)}
.text{width:100%;min-height:50px;padding:10px 14px;font:inherit;font-size:18px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px}
fieldset{border:0;margin:22px 0 0;padding:0;min-width:0}
legend{padding:0;margin-bottom:8px;font-size:14px;color:var(--mute)}
.bgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgcard{position:relative;display:block;min-width:0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.bgcard input{position:absolute;opacity:0;inset:0;cursor:pointer}
.bgcard b{display:block;font-size:15px;line-height:1.4}
.bgcard span{display:block;font-size:13px;line-height:1.5;color:var(--mute)}
.bgcard.on{border-color:var(--brass);background:var(--panel-2)}
.bgcard:focus-within{outline:2px solid var(--brass);outline-offset:2px}
.small{margin:16px 0 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--mute);text-align:center}

/* Mini games */
.arena{margin-top:22px;text-align:center}
.count{font-size:64px;line-height:1.1;color:var(--brass);font-variant-numeric:tabular-nums}
.timer{height:8px;margin:10px 0 22px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.timer u{display:block;height:100%;background:var(--brass);transform-origin:left}
.big{width:min(60vw,220px);aspect-ratio:1;border-radius:50%;font-family:var(--f-display);font-weight:900;font-size:48px;color:var(--brass);background:var(--panel);border:3px solid var(--brass);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.big:active{transform:scale(.95);background:var(--panel-2)}
.big:disabled,.fire:disabled{opacity:.5;cursor:default}
.range{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:repeating-radial-gradient(circle closest-side,#222c1e 0 10%,#2f3b29 10% 20%);overflow:hidden;touch-action:manipulation}
.range::after{content:"";position:absolute;inset:40%;border-radius:50%;background:rgba(226,187,79,.35)}
.cross{position:absolute;z-index:2;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid var(--brass);border-radius:50%;background:linear-gradient(var(--brass),var(--brass)) center/2px 100% no-repeat,linear-gradient(var(--brass),var(--brass)) center/100% 2px no-repeat}
.hole{position:absolute;z-index:1;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--bg);border:2px solid var(--fg)}
.fire{display:block;width:100%;min-height:64px;margin-top:16px;font-size:20px;font-weight:700;letter-spacing:.2em;color:var(--brass-ink);background:var(--brass);border:0;border-radius:10px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fire:active{transform:scale(.98)}

/* Ending */
.endbars{display:grid;gap:10px;margin:22px 0 0}
.endbars .meter .bar{height:8px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.badges li{padding:4px 12px;font-size:14px;color:var(--brass);border:1px solid var(--brass);border-radius:999px}
.epi{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:15px;color:var(--mute)}

/* 3D world layer */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0;background:var(--bg)}
#stage{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:70dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#stage>.scene{max-width:560px;margin:0 auto}
#joy{position:fixed;left:calc(max(18px,env(safe-area-inset-left,0px)) + 8px);bottom:calc(36px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(21,26,19,.5);border:2px solid var(--line);z-index:4;touch-action:none;user-select:none;-webkit-user-select:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--brass);opacity:.85;pointer-events:none}
#nav{position:fixed;top:calc(env(safe-area-inset-top,0px) + 96px);left:50%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--hud);border:1px solid var(--line);font-size:14px;line-height:1.3;white-space:nowrap;pointer-events:none}
#navarr{width:22px;height:22px;display:block;flex:none;color:var(--brass)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
#fade.on{opacity:1;pointer-events:auto}
.keyhint{margin:12px 0 0;font-size:13px;line-height:1.6;color:var(--mute);text-align:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="gl" aria-label="3D 遊戲畫面"></canvas>
<header id="hud" hidden>
  <div class="in">
    <div class="hud-top"><span id="chname"></span><span>饅頭<b id="mantou">—</b></span></div>
    <div class="segs" id="segs"></div>
    <div class="meters" id="meters"></div>
  </div>
</header>
<div id="nav" hidden><svg id="navarr" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L20 20 L12 15.5 L4 20 Z" fill="currentColor"/></svg><span id="navtxt"></span></div>
<div id="joy" hidden aria-label="移動搖桿"><i id="knob"></i></div>
<main id="stage" hidden></main>
<div id="fade"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var K={b:'體能',m:'士氣',d:'軍紀',o:'袍澤'};
var KC={b:'--m-b',m:'--m-m',d:'--m-d',o:'--m-o'};
var CH=['平民','入伍','新訓','下部隊','退伍'];
var NUM=['一','二','三','四','五'];
var TAGS={strong:'體能達人',marksman:'神射手',helper:'患難見真情',rescuer:'救災英雄',mentor:'學長風範',sprinter:'操場飛人',legacy:'留下一張卡片'};
var BGS={
  uni:{n:'剛畢業的大學生',hint:'適應快，體能普通',s:{b:45,m:55,d:50,o:45}},
  office:{n:'上班族',hint:'守時守規矩，體力偏弱',s:{b:40,m:45,d:60,o:40}},
  site:{n:'工地學徒',hint:'體力好，話不多',s:{b:65,m:50,d:45,o:45}},
  gamer:{n:'電競宅男',hint:'手指超快，體能堪憂',s:{b:30,m:60,d:45,o:35}}
};
var UNITS=[
  {n:'陸軍步兵營',vibe:'聽說這裡的日常是跑步、戰技和野外，床板很硬，但同梯很熱。',fx:{b:4}},
  {n:'陸軍砲兵營',vibe:'這裡的口號是「準確」。每個動作都要算數，連打掃都要量尺寸。',fx:{d:4}},
  {n:'空軍基地',vibe:'飛機起降的聲音比鬧鐘還準時。這裡的人說話都很輕，做事都很準。',fx:{m:3,d:2}},
  {n:'海軍艦艇',vibe:'你要學會在搖晃的甲板上站穩，也要學會在狹小的艙房裡跟同梯和平共處。',fx:{o:4,b:1}},
  {n:'後勤補給單位',vibe:'清點、登記、運送。這裡沒有槍林彈雨，卻有永遠數不完的箱子。',fx:{o:3,m:2}}
];
var ENDS=[
  {id:'exemplar',n:'模範役男',ok:function(s){return s.d>=70&&s.b>=65&&s.o>=65&&s.m>=60},t:'退伍典禮上，連長念出你的名字，說你是這一梯裡「最讓人放心的人」。台下的班長沒說話，只是把手放在胸口。'},
  {id:'brother',n:'一輩子的戰友',ok:function(s){return s.o>=70},t:'你在營裡交到了比想像中更多的朋友。退伍那天，大家擠在營門口，互相拍肩、互留電話，約好每年一定要聚一次。'},
  {id:'iron',n:'鋼鐵之軀',ok:function(s){return s.b>=75},t:'你的肩膀厚了，腿結實了，連走路都像在行軍。回家時媽媽摸了摸你的手臂，問：「你是不是吃了什麼特別的東西？」'},
  {id:'rule',n:'軍紀典範',ok:function(s){return s.d>=75},t:'你的每個動作都標準得像教範。連長說你是他帶過最不需要提醒的人。你自己也沒發現，早上五點半的你，連鬧鐘都不需要了。'},
  {id:'sunny',n:'陽光大兵',ok:function(s){return s.m>=75},t:'不管多累，你總是笑著。大家說，只要你在，連隊的氣氛就不會太糟。連班長都偷偷承認：「有你在，我也輕鬆一點。」'},
  {id:'calm',n:'平安退伍',ok:function(s){return s.b+s.m+s.d+s.o>=215},t:'沒有轟轟烈烈，也沒闖出什麼大禍，你平平安安走完這一年。在軍中，這大概是最難得的成就。'},
  {id:'phew',n:'終於撐過來了',ok:function(){return true},t:'這一年磕磕碰碰，你也有過想放棄的夜晚。但你還是走到了最後一天。能走完，本身就值得驕傲。'}
];

var VENDS=[
  {id:'vstar',n:'志願役新星',ok:function(s){return s.d>=70&&s.b>=60},t:'連長在名冊上寫下你的名字，旁邊多了一行小字：「可造之材」。新一年的訓練計畫上，你的名字被排在最前面。'},
  {id:'vlead',n:'帶兵的人',ok:function(s){return s.o>=65},t:'簽下志願役後，你成了新兵口中的「那個學長」。他們遇到問題，第一個想到的就是你。你這才明白，被人需要，是這麼沉的一件事。'},
  {id:'vstep',n:'一步一腳印',ok:function(){return true},t:'你沒有最強的體能，也不是全連最亮眼的那個。但你選擇留下，就一步一步走。明天的哨音，你還是會準時起床。'}
];
var ALLN=ENDS.length+VENDS.length;
var G=null, lastName='王小明', lastBg='uni', lastThird=true;
var stage=$('#stage');

var OTHERS=/[他她]|阿凱|班長|學長|連長|爸爸|媽媽|軍官|輔導長|學弟|阿嬤|爺爺|老士官|值星官|同梯|醫官|衛生兵|店員|老兵|長官|家人/;
function third(s){
  var amb=/[他她]/.test(s),first=OTHERS.test(s);
  return s.split(/(「[^」]*」)/).map(function(p,i){
    if(i%2)return p;
    return p.replace(/你們/g,'他們').replace(/你/g,function(){
      var r=first?'{name}':'他';
      if(!amb)first=false;
      return r;
    });
  }).join('');
}
function T(s){
  if(G&&G.third)s=third(s);
  return esc(s)
    .replace(/\{name\}/g,function(){return esc(G.name)})
    .replace(/\{unit\}/g,function(){return esc(G.unit?G.unit.n:'')})
    .replace(/\{bg\}/g,function(){return esc(BGS[G.bg].n)});
}
function chName(){return (G.ch===4&&G.flags&&G.flags.vol)?'志願役':CH[G.ch]}
function paras(a){return (Array.isArray(a)?a:[a]).map(function(p){return '<p>'+T(p)+'</p>'}).join('')}
function head(sc){
  var d=G.day?' · 第 '+G.day+' 天':'';
  return '<p class="kicker">第'+NUM[G.ch]+'章 · '+chName()+d+'</p><h1 class="title">'+T(sc.title)+'</h1>';
}
function getU(){try{return JSON.parse(localStorage.getItem('abg-endings')||'[]')}catch(e){return []}}
function setU(id){try{var u=getU();if(u.indexOf(id)<0){u.push(id);localStorage.setItem('abg-endings',JSON.stringify(u))}}catch(e){}}

/* HUD */
function buildHud(){
  $('#segs').innerHTML=CH.map(function(){return '<i></i>'}).join('');
  $('#meters').innerHTML=Object.keys(K).map(function(k){
    return '<div class="meter" data-k="'+k+'"><div class="row"><span>'+K[k]+'</span><em>0</em></div><div class="bar"><u style="--c:var('+KC[k]+')"></u></div></div>';
  }).join('');
}
function hud(){
  var h=$('#hud');
  if(!G){h.hidden=true;return}
  h.hidden=false;
  $('#chname').textContent='第'+NUM[G.ch]+'章 · '+chName();
  $('#mantou').textContent=G.day>0?String(365-G.day):'—';
  var segs=document.querySelectorAll('#segs i');
  for(var i=0;i<segs.length;i++){segs[i].className=i<G.ch?'done':(i===G.ch?'cur':'')}
  Object.keys(K).forEach(function(k){
    var m=document.querySelector('.meter[data-k="'+k+'"]');
    m.querySelector('em').textContent=G.s[k];
    m.querySelector('u').style.width=G.s[k]+'%';
  });
}

/* Flow */
function newGame(name,bg){
  G={name:name,bg:bg,s:Object.assign({},BGS[bg].s),day:0,i:0,ch:0,unit:null,tags:[],flags:{},third:!!lastThird};
}
function resolve(label,text,fx,tag,flag){
  var before=Object.assign({},G.s),k;
  for(k in fx){G.s[k]=Math.max(0,Math.min(100,G.s[k]+fx[k]))}
  if(tag&&G.tags.indexOf(tag)<0)G.tags.push(tag);
  G.flags=G.flags||{};
  (Array.isArray(flag)?flag:(flag?[flag]:[])).forEach(function(f){G.flags[f]=1});

function choose(c){
  var out=c,ok;
  if(c.pass){
    ok=c.check?(G.s[c.check.stat]+Math.random()*40>=c.check.dc):(Math.random()<c.chance);
    out=ok?c.pass:c.fail;
  }
  resolve(c.t,out.r,out.fx||{},out.tag,out.flag);
}

/* Mini game: push-ups */
function pushups(sc){
  stage.innerHTML='<section class="scene">'+head(sc)+'<div class="prose">'+paras(sc.text)+'</div>'+
    '<div class="arena"><div class="count mono" id="cnt">0</div><div class="timer"><u id="tm"></u></div>'+
    '<button class="big" id="pb" aria-label="壓">壓</button><p class="hint" id="ph">點一下開始計時，十秒內越快越好</p></div></section>';
  var n=0,t0=0,done=false,btn=$('#pb'),cnt=$('#cnt'),tm=$('#tm');
  function loop(now){
    if(done)return;
    var e=(now-t0)/10000;
    tm.style.transform='scaleX('+Math.max(0,1-e)+')';
    if(e>=1){finish();return}
    requestAnimationFrame(loop);
  }
  function tap(){
    if(done)return;
    if(!t0){t0=performance.now();$('#ph').textContent='壓！壓！壓！';requestAnimationFrame(loop)}
    n++;cnt.textContent=n;
  }
  btn.addEventListener('pointerdown',function(ev){ev.preventDefault();tap()});
  btn.addEventListener('click',function(ev){if(ev.detail===0)tap()});
  function finish(){
    done=true;btn.disabled=true;tm.style.transform='scaleX(0)';
    $('#ph').textContent='時間到！';
    setTimeout(function(){
      var r;
      if(n>=45)r={fx:{b:8,m:4},tag:'strong',t:['十秒，'+n+' 下。','班長低頭看了看碼表，又看了看你。「有練過？」他問。你只是喘氣，說不出話。']};
      else if(n>=30)r={fx:{b:4,m:2},t:['十秒，'+n+' 下。','班長在名冊上寫了個數字，沒說好壞。你知道，這大概算「還行」。']};
      else r={fx:{b:1,m:-2},t:['十秒，'+n+' 下。','手臂像煮過頭的麵條。班長說：「沒關係，這就是為什麼要練。」你點點頭，在心裡默默記下。']};
      resolve('完成測驗',r.t,r.fx,r.tag);
    },800);
  }
}

/* Mini game: rifle range */
function shoot(sc){
  stage.innerHTML='<section class="scene">'+head(sc)+'<div class="prose">'+paras(sc.text)+'</div>'+
    '<div class="arena"><div class="range" id="rg"><i class="cross" id="cr"></i></div>'+
    '<p class="hint" id="sh">已射 0 / 3　累計 0 環</p><button class="fire" id="fb">擊發</button></div></section>';
  var rg=$('#rg'),cr=$('#cr'),fb=$('#fb'),shot=0,total=0,t=0,u=0,v=0,run=true,last=performance.now();
  function step(now){
    if(!run)return;
    var dt=Math.min(0.05,(now-last)/1000);last=now;
    t+=dt*(1+shot*0.25);
    u=Math.sin(t*1.7)*0.95;v=Math.sin(t*2.3+1.1)*0.95;
    cr.style.left=(50+u*50)+'%';cr.style.top=(50+v*50)+'%';
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  function fire(){
    if(!run)return;
    var d=Math.hypot(u,v),pts=Math.max(0,10-Math.floor(d*10));
    total+=pts;shot++;
    var h=document.createElement('i');h.className='hole';
    h.style.left=(50+u*50)+'%';h.style.top=(50+v*50)+'%';rg.appendChild(h);
    $('#sh').textContent='已射 '+shot+' / 3　累計 '+total+' 環（這發 '+pts+' 環）';
    if(shot>=3){
      run=false;fb.disabled=true;
      setTimeout(function(){
        var r;
        if(total>=24)r={fx:{d:7,m:6},tag:'marksman',t:['三發，共 '+total+' 環。','班長拿著望遠鏡看了很久，轉頭對你說：「你有天分。」他停了一下，又補一句：「但別驕傲。」']};
        else if(total>=15)r={fx:{d:4,m:2},t:['三發，共 '+total+' 環。','成績在及格線之上。班長點頭：「穩定最重要。」']};
        else r={fx:{d:1,m:-2},t:['三發，共 '+total+' 環。','靶紙上的洞比你想像的還要散。班長只說：「再練。」你很想為自己辯解，卻發現沒有什麼好辯解的。']};
        resolve('完成射擊',r.t,r.fx,r.tag);
      },1000);
    }
  }
  fb.addEventListener('pointerdown',function(ev){ev.preventDefault();fire()});
  fb.addEventListener('click',function(ev){if(ev.detail===0)fire()});
}

  c('衝過去抱住媽媽','媽媽摸著你的光頭，說：「怎麼變這麼黑、這麼瘦？」你說沒有，她又說有。你們都笑了。',{m:10}),
  c('站得筆直，給爸媽看你的敬禮','爸爸挺起胸膛，像是在說：「這是我兒子。」媽媽一邊拍照一邊擦眼淚。',{d:5,m:4}),
  c('帶爸媽去認識阿凱和同梯','媽媽把帶來的水果分給大家，一轉眼就被搶光。阿凱偷偷對你說：「你媽媽好棒。」',{o:6,m:4})
 ]},
{ch:2,day:33,title:'夜行軍',text:[
 '半夜被哨音叫醒，全副武裝集合。「今天，走一趟夜行軍。」',
 '月光很冷，背上的裝備很重。走到一半，阿凱的腳起了水泡，臉色發白，漸漸落在隊伍後面。'],
 choices:[
  c('放慢腳步，陪阿凱一起走','你們落後了一小段。班長回頭看了你們一眼，沒說話，卻把隊伍的速度放慢了。阿凱低聲說：「欠你一次。」',{o:8,b:-3,m:2},{tag:'helper'}),
  c('幫阿凱背他的裝備','肩膀被勒得發麻，但你還是咬牙走完全程。阿凱說：「你是不是有病？」然後把水壺遞給你，說：「喝一口。」',{o:6,b:-6},{tag:'helper'}),
  c('專心跟上隊伍，顧好自己','你沒有回頭。後來你一直記得那個畫面：阿凱的背影越來越小。',{b:3,d:2,o:-3})
 ]},
{ch:2,day:40,title:'軍歌比賽',text:[
 '連上要舉辦軍歌比賽。班長站在隊伍前面：「獎品是——當晚加菜。」',
 '全連瞬間眼睛發亮。分組、練唱、排隊形。你們這一班的指揮，要從你們之中挑一個。'],
 choices:[
  c('舉手自願當指揮','',{},{check:{stat:'m',dc:50},
    pass:{r:'你站在全班前面，手一揮，大家的聲音整齊地蓋過了整個操場。成績公布，你們拿下第二名，當晚真的加了菜。',fx:{m:6,o:4}},
    fail:{r:'你手一揮，全班唱到不同的拍子。班長在台下憋笑憋到肩膀發抖。雖然沒拿名次，但全班笑成一團，氣氛好得不得了。',fx:{m:-1,o:3}}}),
  c('站在隊伍裡，大聲唱就好','你唱得很大聲，破音破到班長回頭看你。全班笑成一團，反而放鬆了。',{o:4,m:3}),
  c('負責喊口號、帶動氣氛','你一喊，後面的人就跟著吼。操場上的聲音越來越大，你覺得自己的胸口也跟著熱了起來。',{o:6,m:2,d:1})
 ]},
{type:'shoot',ch:2,day:45,title:'實彈射擊',text:[
 '靶場。空氣裡有火藥和青草的味道。',
 '班長走到每個人面前，只說一句話：「槍口，永遠朝向安全方向。」',
 '你有三發子彈。看準時機，按下「擊發」。']},
{type:'draw',ch:2,day:56,title:'抽籤',text:[
 '新訓即將結束。大家被叫到禮堂集合，前面擺著一個箱子。',
 '「抽到哪裡，就去哪裡。」班長說，「不要挑，不要換，不要問為什麼。」',
 '你把手伸進去，摸到一張摺好的紙條。']},
{ch:3,day:60,title:'下部隊',text:[
 '車子駛進{unit}的大門。連長站在營區前，雙手背在身後。',
 '「歡迎來到{unit}。」他說，「這裡不是學校，也不是公司。接下來大半年，這裡就是你們生活的地方。」',
 '一位老兵學長斜眼看你：「新來的？床位在那邊。」'],
 choices:[
  c('主動向學長問好，請教環境','學長愣了一下，然後把整個營區的「生存地圖」講給你聽：哪個福利社最便宜、哪個班長最嚴、哪裡的冷氣最涼。',{o:5,d:3}),
  c('安靜整理好自己的床位','你把東西擺得整整齊齊。學長瞥了一眼，說了句：「不錯。」這大概是你聽過最高級的稱讚。',{d:4}),
  c('跟同梯一起觀察，先別出頭','你和阿凱默契地沒說話。這個營區有自己的規矩，而你們還在學。',{o:3,m:1})
 ]},
{ch:3,day:75,title:'第一次站哨',text:[
 '凌晨兩點，你背著槍站在{unit}的哨位。四周很安靜，只有蟲鳴、風聲和遠處偶爾的狗叫。',
 '你被交代：任何人接近，都要問口令。',
 '突然，遠處的手電筒光朝你這邊晃過來。'],
 choices:[
  c('站直身體，大聲問口令','「口令！」你的聲音在夜裡格外清楚。對方答對了，原來是查哨的值星官。他點點頭：「很好。」你在心裡鬆了一大口氣。',{d:6,m:2}),
  c('太睏了，硬撐著精神記住口令','',{},{check:{stat:'d',dc:55},
    pass:{r:'你把口令在心裡默念了三遍，答得一字不差。值星官看了你一眼，說：「精神不錯。」',fx:{d:5,m:2}},
    fail:{r:'你差點忘了口令，緊張到有點結巴。值星官看著你，什麼都沒說，但你覺得他在心裡記了一筆。',fx:{d:-2,m:-3}}}),
  c('叫旁邊的哨友一起確認','你們互相提醒、互相確認，像在玩一場嚴肅的對暗號遊戲。結果是對的，兩個人都鬆了一口氣。',{o:4,d:1})
 ]},
{ch:3,day:90,title:'福利社',text:[
 '下部隊後，你發現全營區最重要的地方，不是辦公室，也不是靶場，而是福利社。',
 '冰櫃裡的飲料、貨架上的泡麵，還有那款永遠賣完的餅乾。你口袋裡的錢，只夠買一樣東西。'],
 choices:[
  c('買一罐冰飲料，坐在階梯上發呆','冰涼的汽水沿著喉嚨滑下去，你突然覺得，這個瞬間比什麼都值得。',{m:6}),
  c('買泡麵，和同梯分著吃','三個人圍著一碗泡麵，吃得比滿漢全席還認真。',{o:5,m:3}),
  c('把錢存起來，下次放假再買','你把錢收好。老兵學長看到了，只說了句：「會過日子。」',{d:3,m:1})
 ]},
{ch:3,day:110,title:'公差時間',text:[
 '「公差！今天輪到你們組！」',
 '公差是營區裡的萬能詞：洗菜、搬東西、掃落葉、整理倉庫。今天你被分到伙房，旁邊堆著一座像小山一樣的高麗菜。'],
 choices:[
  c('二話不說開始剝高麗菜','你剝到手都沾了青菜味。伙房的老士官瞄你一眼：「這小子手腳快。」當晚，你的餐盤裡多了一塊肉。',{b:2,d:3,o:2}),
  c('想辦法偷懶，躲去角落','',{},{chance:0.45,
    pass:{r:'沒人發現。你賺到了半小時的發呆時間，覺得自己簡直是天才。',fx:{m:4}},
    fail:{r:'「你在這幹嘛？」班長從背後出現。接下來一個小時，你一個人剝完了半座山。',fx:{d:-6,m:-3}}}),
  c('邊做邊跟旁人聊天，把氣氛炒熱','伙房的氣氛因為你變得活潑，連老士官都被逗笑了。你突然覺得，這裡也沒那麼可怕。',{o:6,m:3})
 ]},
{ch:3,day:135,title:'第一次放假',text:[
 '週五下午，隊伍解散，空氣像是突然被打開了。',
 '好久沒聽到的詞：放假。你終於可以回到那個沒有哨音的世界。'],
 choices:[
  c('回家，窩在沙發上陪家人吃飯','媽媽煮了你最愛吃的菜，一直問你有沒有吃飽。你說有。其實你只是想再多看她幾眼。',{m:10,b:2}),
  c('約同梯聚餐，把一個月的美食一次吃回來','你們三個吃到店員都記住你們的臉。結帳時阿凱說：「下次放假，我還要再來。」',{m:8,o:6,b:-3}),
  c('整天睡覺，補睡眠','你醒來時天已經黑了，彷彿睡過了一整個世紀。但身體說：謝謝。',{b:10,m:3})
 ]},
{ch:3,day:137,title:'收假日',text:[
 '週日傍晚，離收假時間只剩不到兩個小時。',
 '你低頭看了一眼交通資訊：車班延誤。'],
 choices:[
  c('立刻改搭更早的車，寧可提早到','你在營門口等了半小時，換來同樣趕時間的同梯分你的一碗泡麵。準時，永遠是軍中的第一課。',{d:5,m:-2}),
  c('賭一把，說不定還來得及','',{},{chance:0.5,
    pass:{r:'你在最後一分鐘衝進營門，氣喘吁吁地敬了個禮。班長瞪你一眼，你知道自己走運了。',fx:{m:3,d:-1}},
    fail:{r:'你晚了五分鐘。連長沒說什麼，只留下一句：「下次不要再這樣。」接下來一整週，你都覺得自己的名字被人記在小本本上。',fx:{d:-8,m:-5}}}),
  c('打電話回連上報告狀況','電話那頭的值星官語氣不差，只問了你的位置和預計抵達時間，最後說：「小心點，安全最重要。」你突然覺得，這個單位比想像的有人情味。',{d:3,m:-1,o:1})
 ]},
{ch:3,day:150,title:'喉嚨痛',text:[
 '連著幾天的夜哨，你的喉嚨開始發癢，鼻水流個不停。今天早上起床，頭像裝了鉛塊。',
 '班長站在門口：「有不舒服的人，舉手。」'],
 choices:[
  c('老實舉手，請求就醫','衛生兵幫你量了體溫，醫官開了藥，還讓你休息半天。班長說：「身體是自己的，別硬撐。」',{d:3,b:5,m:-1}),
  c('硬撐過去，不想麻煩別人','',{},{check:{stat:'b',dc:55},
    pass:{r:'你撐完了操課，晚上吃了藥，睡一覺好多了。不過班長看你的眼神，有點「下次不准」的意思。',fx:{b:-1,d:2}},
    fail:{r:'你在隊伍裡晃了兩下，被班長一把扶住。「逞強的人最麻煩。」他嘴上這樣說，眼神卻滿是擔心。',fx:{b:-6,m:-4}}}),
  c('請同梯幫忙轉告班長','阿凱替你向班長報告，還幫你帶了熱水回來。「換你好了再請我。」他說。',{o:3,b:3})
 ]},
{ch:3,day:170,title:'三千公尺',text:[
 '清晨六點，操場。班長舉起手。「今天三千公尺。」',
 '你站在起跑線，旁邊的人不斷做伸展，心跳聲大到連你自己都聽得見。'],
 choices:[
  c('穩住配速，前半段保留體力','',{},{check:{stat:'b',dc:50},
    pass:{r:'最後一圈，你發現自己還有力氣衝刺。你超過了三個人，衝線時整個人倒在草地上，笑得像個傻瓜。',fx:{b:6,m:4}},
    fail:{r:'最後兩圈，腿像灌了鉛。你還是走完了全程，雖然成績不好看，但這一次你沒有放棄。',fx:{b:2,m:-1}}}),
  c('一開始就衝，想拿第一','',{},{check:{stat:'b',dc:62},
    pass:{r:'你一路領先，風從耳邊呼嘯而過。衝線那一刻，全連都在喊你的名字。你這輩子第一次這麼像運動員。',fx:{b:8,m:6},tag:'sprinter'},
    fail:{r:'你在第三圈爆了。後面的人一個接一個超過你，你只能咬牙把剩下的路走完。',fx:{b:-2,m:-4}}}),
  c('跟著阿凱，兩個人互相打氣','你們一路喊著「再一圈、再一圈」，邊跑邊笑。成績不是最好的，但你們一起衝線。',{o:5,b:3,m:3})
 ]},
{ch:3,day:190,title:'學長要走了',text:[
 '那位第一天跟你說「床位在那邊」的老兵學長，今天要退伍了。',
 '全連有兩位學長役期屆滿。一位收拾行李準備回家，另一位在簽完志願役文件後，把義務役的臂章拆下來，換上新的。',
 '兩個人的背影，你看了很久。'],
 choices:[
  c('問要退伍的學長：退伍後有什麼打算？','他說：「先睡三天，再吃三天，然後找個工作。」他笑著說完，眼神卻亮亮的。你突然很期待那一天。',{m:4}),
  c('問選擇留下的學長：為什麼簽？','他想了很久，說：「我發現我喜歡這裡的一些東西。有人需要你，也有人跟你一起扛。」他沒再多講，但你記住了這句話。',{d:3,m:2},{flag:'curious'}),
  c('幫兩位學長一起搬行李','他們同時說：「謝了學弟。」你扛著箱子，不知道為什麼心裡有點酸。',{o:5})
 ]},
{ch:3,day:205,title:'戰備演練',text:[
 '連上突然進入戰備狀態。所有人被叫醒、集合、編組。這是一場大型演練，每個人都有自己的任務。',
 '你被分配到的任務是——'],
 choices:[
  c('通信：保持無線電暢通','你整晚盯著電台，一個字一個字確認。成功傳遞命令的那一刻，你覺得自己像個真正的軍人。',{d:5,m:2}),
  c('搬運：把物資送到前線','你和同梯扛著箱子來回跑。累是真的累，但看到補給到位的瞬間，大家都笑了。',{b:5,o:3}),
  c('警戒：守住最外圍的哨','天亮前最黑暗的那段時間，你什麼都沒看到，卻比任何時候都清醒。',{d:3,b:2,m:2})
 ]},
{ch:3,day:225,title:'少了一個水壺',text:[
 '晚點名前清點裝備，班長數了兩次，眉頭皺起來。「少了一個水壺。」',
 '全班安靜。你低頭一看，自己的背包裡怎麼……沒有？你確定早上還在。'],
 choices:[
  c('立刻舉手：「報告，是我的」','班長盯著你看了三秒。「誠實是好事。」他說，「這次我們一起找。」最後，水壺在盥洗室的架子上找到了。',{d:6,m:-2}),
  c('假裝沒事，晚點偷偷去找','',{},{chance:0.4,
    pass:{r:'你趁熄燈前衝去盥洗室，剛好找到。你把它塞回背包，心跳還在狂飆。',fx:{m:3,d:-2}},
    fail:{r:'班長早就發現了。他沒說話，只是看著你，然後說：「晚點來找我。」那晚你寫了一份很長的報告。',fx:{d:-7,m:-3}}}),
  c('找阿凱一起去找','你們繞了整個營區三圈，最後在洗衣間的窗台上找到。班長什麼都沒說，只是點了點頭。',{o:4,d:2})
 ]},
{ch:3,day:240,title:'颱風過後',text:[
 '颱風離開後，營區外的小鎮一片狼藉。河水漫進街道，路邊有倒下的樹和被淹過的店鋪。',
 '連長集合大家：「救災，就是我們的任務。」',
 '你拿著鏟子，走進一條滿是泥濘的巷子。一位阿嬤站在家門口，看著被淹過的屋子，不知道該從哪裡開始。'],
 choices:[
  c('先幫阿嬤把家具搬到高處','你和同梯一起搬、一起刷。阿嬤一直說謝謝，塞給你們一袋橘子。你坐在階梯上吃，覺得那是你吃過最甜的橘子。',{o:3,m:6,b:-3},{tag:'rescuer'}),
  c('先清理排水溝，讓水退得快一點','你一鏟一鏟把淤泥挖出來。水慢慢退去的那一刻，街上有人鼓掌。',{d:5,b:-3,m:4},{tag:'rescuer'}),
  c('陪阿嬤坐一下，聽她說話','你拿水給阿嬤，聽她講這間店從她爸爸那一代開始的故事。你沒做什麼了不起的事，但她握住你的手說：「有你們在，我就比較安心。」',{o:4,m:8})
 ]},
function(g){
  if(g.s.m<45){
    return {ch:3,day:255,title:'輔導長找你聊聊',text:[
      '最近你有點沉默。吃飯變慢了，笑也變少了。',
      '某天晚上，輔導長把你叫進辦公室，倒了杯熱茶給你。「不用緊張，」他說，「我只是想聽聽你怎麼了。」'],
      choices:[
        c('老實說出心裡的壓力','你講了二十分鐘，輔導長一句話都沒打斷。最後他說：「每個人都有撐不下去的時候，說出來，就已經贏了一半。」',{m:10,o:2}),
        c('笑笑說沒事','輔導長點點頭，沒多問，只說：「有事隨時來找我。」你走出辦公室，心裡卻比進去前還悶了一點。',{m:-2}),
        c('提到你想念家人','輔導長幫你安排了一通電話。聽到家人聲音的那一刻，你的眼眶紅了。',{m:6,o:2})
      ]};
  }
  return {ch:3,day:255,title:'學弟來了',text:[
    '新的一批新兵下部隊了。他們站在門口，頭髮短短的，眼神緊張，一看就知道剛入伍不久。',
    '你忽然發現，原來你已經不是「新來的」了。'],
    choices:[
      c('主動帶學弟熟悉環境','你把當初學長教你的「生存地圖」又講了一遍，還多加了幾條你自己踩過的坑。學弟們聽得眼睛發亮。',{o:7,d:3,m:3},{tag:'mentor'}),
      c('分享你踩過的坑','「那個班長看起來很兇，其實心很軟。」「那間福利社的泡麵最便宜。」學弟們笑著點頭，你覺得自己好像突然長大了。',{o:5,m:4},{tag:'mentor'}),

  MAPS.exit=function(){

  function loadMap(key){

  }

  /* ---------- avatar ---------- */
  var avatar=null,avSig='';

    if(civ){
      var C={uni:['#4a78a8','#3a4258'],office:['#e9ebee','#4b4f58'],site:['#d98a2f','#4a4a42'],gamer:['#2b2b33','#3a3f55']}[bg]||['#4a78a8','#3a4258'];
      return {sig:'c-'+bg,spec:{shirt:C[0],pants:C[1],hair:'#2a2220',skin:'#e2b48c',shoes:'#e8e8e8'}};

  }

    avatar=person(o.spec);avatar.position.set(S.px,0,S.pz);avatar.rotation.y=rot;scene.add(avatar);avSig=o.sig;
  }

  /* ---------- objective marker ---------- */
  var mk=new THREE.Group(),mkMat=new THREE.MeshBasicMaterial({color:'#e2bb4f'});
  var ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.5,40),mkMat);ring.rotation.x=-Math.PI/2;ring.position.y=.1;mk.add(ring);
  var beam=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,7,24,1,true),new THREE.MeshBasicMaterial({color:'#e2bb4f',transparent:true,opacity:.2,depthWrite:false,side:THREE.DoubleSide}));beam.position.y=3.5;mk.add(beam);
  var gem=new THREE.Mesh(new THREE.OctahedronGeometry(.4),mkMat);gem.position.y=3.4;mk.add(gem);
  mk.visible=false;scene.add(mk);

  /* ---------- input ---------- */
  var joy=$('#joy'),knob=$('#knob'),navEl=$('#nav'),navarr=$('#navarr'),navtxt=$('#navtxt'),jid=null,jv={x:0,y:0},keys={};
  function jmove(e){
    var r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),mx=r.width/2-12;
    if(m>mx){dx*=mx/m;dy*=mx/m}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';jv.x=dx/mx;jv.y=-dy/mx;
  }
  joy.addEventListener('pointerdown',function(e){jid=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(x){}jmove(e);e.preventDefault()});
  joy.addEventListener('pointermove',function(e){if(e.pointerId===jid)jmove(e)});
  function jend(e){if(e.pointerId===jid){jid=null;jv.x=0;jv.y=0;knob.style.transform='translate(0,0)'}}
  joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
  var oid=null,ox=0,oy=0;
  cv.addEventListener('pointerdown',function(e){if(oid!==null)return;oid=e.pointerId;ox=e.clientX;oy=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(x){}});
  cv.addEventListener('pointermove',function(e){
    if(e.pointerId!==oid)return;
    S.yaw-=(e.clientX-ox)*.008;S.pitch=Math.max(.12,Math.min(1.05,S.pitch+(e.clientY-oy)*.004));ox=e.clientX;oy=e.clientY;S.autoT=0;
  });
  function oend(e){if(e.pointerId===oid)oid=null}
  cv.addEventListener('pointerup',oend);cv.addEventListener('pointercancel',oend);
  window.addEventListener('keydown',function(e){if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=1});
  window.addEventListener('keyup',function(e){delete keys[e.code]});
  window.addEventListener('blur',function(){keys={}});
  function kx(){return ((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0)}
  function ky(){return ((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0)}
  if(window.ResizeObserver){new ResizeObserver(function(){S.sheetH=stage.hidden?0:stage.offsetHeight}).observe(stage)}

  function resize(){var w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();S.w=w;S.h=h}
  window.addEventListener('resize',resize);resize();

  /* ---------- update ---------- */
  function turn(a,b,k){return a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*k}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  var PR=.45;
  function collide(){
    for(var it=0;it<2;it++){
      for(var i=0;i<S.cols.length;i++){
        var q=S.cols[i],cx=clamp(S.px,q.x0,q.x1),cz=clamp(S.pz,q.z0,q.z1),dx=S.px-cx,dz=S.pz-cz,d2=dx*dx+dz*dz;
        if(d2<PR*PR){
          if(d2>1e-8){var d=Math.sqrt(d2);S.px=cx+dx/d*PR;S.pz=cz+dz/d*PR}
          else{
            var l=S.px-q.x0,r=q.x1-S.px,t=S.pz-q.z0,b=q.z1-S.pz,m=Math.min(l,r,t,b);
            if(m===l)S.px=q.x0-PR;else if(m===r)S.px=q.x1+PR;else if(m===t)S.pz=q.z0-PR;else S.pz=q.z1+PR;
          }
        }
      }
    }
    var B=S.bounds;S.px=clamp(S.px,B[0],B[1]);S.pz=clamp(S.pz,B[2],B[3]);
  }
  function setMode(m){
    S.mode=m;var w=m==='world';
    joy.hidden=!w;navEl.hidden=!(w&&S.target);mk.visible=w&&!!S.target;
  }
  function update(dt){
    S.t+=dt;applyTone(dt);
    var moving=0;
    if(S.mode==='world'){
      var jx=clamp(jv.x+kx(),-1,1),jy=clamp(jv.y+ky(),-1,1),mag=Math.hypot(jx,jy);
      if(mag>.12){
        var f0=-Math.sin(S.yaw),f1=-Math.cos(S.yaw),r0=Math.cos(S.yaw),r1=-Math.sin(S.yaw);
        var mx=r0*jx+f0*jy,mz=r1*jx+f1*jy,ml=Math.hypot(mx,mz)||1,spd=5.4*Math.min(1,mag);
        S.px+=mx/ml*spd*dt;S.pz+=mz/ml*spd*dt;S.face=Math.atan2(mx,mz);moving=Math.min(1,mag);
      }
      collide();
      if(S.target&&S.onArrive&&!S.fade&&Math.hypot(S.px-S.target.x,S.pz-S.target.z)<2.4){
        var cb=S.onArrive;S.onArrive=null;setMode('arrive');cb();
      }
    }else if(S.mode==='title'||S.mode==='end'){
      S.yaw+=dt*.32;S.face=S.yaw;
    }
    if(S.autoT>0){S.autoT-=dt;S.yaw=turn(S.yaw,S.autoYaw,Math.min(1,dt*3))}

    S.mv+=(moving-S.mv)*Math.min(1,dt*10);
    if(avatar){
      avatar.position.set(S.px,Math.abs(Math.sin(S.t*9))*.05*S.mv,S.pz);
      avatar.rotation.y=turn(avatar.rotation.y,S.face,Math.min(1,dt*12));
      var ud=avatar.userData,sw=Math.sin(S.t*9)*.85*S.mv;
      ud.legL.rotation.x=sw;ud.legR.rotation.x=-sw;ud.armL.rotation.x=-sw*.9;ud.armR.rotation.x=sw*.9;
    }
    for(var ni=0;ni<S.npcs.length;ni++){var n=S.npcs[ni];if(n.wave)n.g.userData.armR.rotation.x=-2.5+Math.sin(S.t*6+n.x)*.45}

    if(mk.visible){
      gem.rotation.y+=dt*2;gem.position.y=3.4+Math.sin(S.t*3)*.25;beam.material.opacity=.16+.07*Math.sin(S.t*3);
      var rs=1+.06*Math.sin(S.t*4);ring.scale.set(rs,rs,1);
    }
    if(S.mode==='world'&&S.target){
      var tx=S.target.x-S.px,tz=S.target.z-S.pz,fx=-Math.sin(S.yaw),fz=-Math.cos(S.yaw),ang=Math.atan2(fx*tz-fz*tx,fx*tx+fz*tz);
      navarr.style.transform='rotate('+ang+'rad)';
      navtxt.textContent='前往：'+S.target.label+' · '+Math.round(Math.hypot(tx,tz))+' 公尺';
    }

    var dT,pT;
    if(S.mode==='scene'){dT=5;pT=.3}else if(S.mode==='title'||S.mode==='end'){dT=6.5;pT=.3}else{dT=8.5;pT=S.pitch}
    var k=Math.min(1,dt*3.5);S.distC+=(dT-S.distC)*k;S.pitchC+=(pT-S.pitchC)*k;
    var cx2=S.px+Math.sin(S.yaw)*Math.cos(S.pitchC)*S.distC,cz2=S.pz+Math.cos(S.yaw)*Math.cos(S.pitchC)*S.distC,cy2=Math.max(.6,1.3+Math.sin(S.pitchC)*S.distC);
    cam.position.set(cx2,cy2,cz2);cam.lookAt(S.px,1.2,S.pz);
    stars.position.copy(cam.position);

    var sheetOn=(S.mode==='scene'||S.mode==='title'||S.mode==='end')&&!stage.hidden;
    var offT=sheetOn?Math.min(S.h*.42,S.sheetH*.5):0;
    S.off+=(offT-S.off)*Math.min(1,dt*6);
    if(S.off>1)cam.setViewOffset(S.w,S.h,0,S.off,S.w,S.h);else if(cam.view&&cam.view.enabled)cam.clearViewOffset();
  }
  var last=performance.now();
  function frame(now){requestAnimationFrame(frame);var dt=Math.min(.05,(now-last)/1000);last=now;update(dt);R.render(scene,cam)}
  requestAnimationFrame(frame);

  /* ---------- API ---------- */
  function fadeTo(on){$('#fade').classList.toggle('on',on)}
  function go(map,key,ttl,cb){
    S.onArrive=cb;
    var need=S.mapKey!==map||S.fromTitle;
    function place(){
      if(need){loadMap(map);S.px=S.spawn[0];S.pz=S.spawn[1];S.fromTitle=false;S.mv=0}
      var Lc=S.locs[key]||null;S.target=Lc;
      if(Lc){
        mk.position.set(Lc.x,0,Lc.z);S.autoYaw=Math.atan2(S.px-Lc.x,S.pz-Lc.z);
        if(need){S.yaw=S.autoYaw;S.autoT=0}else S.autoT=1.6;
      }
      setTone(NIGHT[ttl]?'night':'day',need);
      dress();setMode('world');
      if(!Lc&&S.onArrive){var f=S.onArrive;S.onArrive=null;f()}
    }
    if(need){
      S.fade=true;fadeTo(true);
      setTimeout(function(){place();fadeTo(false);setTimeout(function(){S.fade=false},480)},500);
    }else place();
  }
  function sceneAt(key,ttl){
    setMode('scene');S.here=key;dress();
    var Lc=S.locs[key];
    if(Lc){
      S.face=Math.atan2(Lc.x-S.px,Lc.z-S.pz);
      var best=null,bd=3.6;
      S.npcs.forEach(function(n){var d=Math.hypot(n.x-Lc.x,n.z-Lc.z);if(d<bd){bd=d;best=n}});
      if(best)best.g.rotation.y=Math.atan2(S.px-best.x,S.pz-best.z);
      S.autoYaw=Math.atan2(S.px-Lc.x,S.pz-Lc.z)+.6;S.autoT=1.6;
    }
    if(ttl!=null)setTone(NIGHT[ttl]?'night':'day');
  }
  function titleMode(){
    if(S.mapKey!=='camp1')loadMap('camp1');
    S.px=0;S.pz=-8;S.face=S.yaw;S.fromTitle=true;S.target=null;S.here=null;S.onArrive=null;S.fade=false;
    fadeTo(false);setTone('day',true);dress();setMode('title');
  }
  function endMode(){S.target=null;setMode('end')}
  function same(map,key){return S.mode==='scene'&&S.mapKey===map&&S.here===key}
  return {ok:true,go:go,scene:sceneAt,title:titleMode,ending:endMode,same:same,dress:dress,S:S,loadMap:loadMap,MAPS:MAPS};
})();

function peek(){
  var guard=0,sc;
  while(guard++<8){
    if(G.i>=SC.length)return null;
    sc=SC[G.i];if(typeof sc==='function')sc=sc(G);
    if(sc)return sc;
    G.i++;
  }
  return null;
}
function advance(){
  if(!Wd.ok){show();return}
  var sc=peek();
  if(!sc||sc.type==='ending'){show();return}
  var ch=sc.ch!=null?sc.ch:G.ch,map=MAPOF[ch],key=TITLEKEY[sc.title];
  if(sc.ch!=null)G.ch=sc.ch;
  if(sc.day!=null)G.day=sc.day;
  hud();
  if(Wd.same(map,key)){show();return}
  stage.hidden=true;
  Wd.go(map,key,sc.title,function(){show()});
}
window.__abing={Wd:Wd,getG:function(){return G},SC:SC,advance:advance,TITLEKEY:TITLEKEY,MAPOF:MAPOF};

buildHud();
function start(d){
  if(d&&d.G&&d.G.s){G=d.G;advance()}else title();
}
try{
  var hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot)hot.snapshot(function(){return G?{G:G}:{}});
  if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
}catch(e){title()}
})();
</script>
